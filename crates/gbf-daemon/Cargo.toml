[package]
name = "gbf-daemon"
version = "1.0.0"
edition = "2021"
description = "Native Rust control plane daemon, JST peak-hour scheduler, Web/WS gateway, and CDP multiplexer for Granblue Fantasy automation"

[[bin]]
name = "gbf-daemon"
path = "src/main.rs"

[dependencies]
gbf-core = { path = "../gbf-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aho-corasick = "1.1"
memchr = "2.7"
rustc-hash = "2.1"
