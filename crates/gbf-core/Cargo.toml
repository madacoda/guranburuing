[package]
name = "gbf-core"
version = "1.0.0"
edition = "2021"
description = "High-performance Rust native core for guranburuing (SIMD telemetry, biomechanical motor kinematics, raid velocity evaluation, and JST scheduling)"
license = "MIT"

[lib]
name = "gbf_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
aho-corasick = "1.1"
memchr = "2.7"
parking_lot = "0.12"
rand = { version = "0.8", features = ["small_rng", "std", "std_rng"] }
rand_distr = "0.4"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
