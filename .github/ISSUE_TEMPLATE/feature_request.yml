name: Feature Request
description: Propose a new feature, workflow template, or optimization.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new raid farmer, performance optimization, or UI enhancement? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation? Please describe.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution or Behavior
      description: Describe what you would like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
